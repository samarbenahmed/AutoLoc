# Configuration utilisee uniquement pendant les tests : base H2 en memoire.
# Elle remplace la configuration MySQL de src/main/resources pour la classe de test,
# ce qui permet de lancer la suite de tests sans MySQL.
spring.datasource.url=jdbc:h2:mem:autoLocTest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
